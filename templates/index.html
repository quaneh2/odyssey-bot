<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ask questions about Homer's The Odyssey and receive AI-powered answers with citations from the original text.">
    <title>Ask The Odyssey</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header role="banner">
            <h1>Ask The Odyssey</h1>
            <p class="subtitle">Explore Homer's epic through AI-powered question answering</p>
        </header>

        <main role="main">
            <section class="query-section" aria-label="Question input">
                <label for="question-input" class="visually-hidden">Your question about The Odyssey</label>
                <textarea
                    id="question-input"
                    placeholder="Ask a question about The Odyssey..."
                    rows="4"
                    aria-label="Question input"
                ></textarea>
                <button id="submit-btn" class="submit-button" type="button">Ask Question</button>
                <div id="loading" class="loading hidden" role="status" aria-live="polite">
                    <div class="spinner" aria-hidden="true"></div>
                    <span>Processing your question...</span>
                </div>
            </section>

            <section class="examples-section" aria-label="Example questions">
                <h3>Example Questions</h3>
                <div class="example-questions" role="list">
                    <button class="example-btn" type="button" data-question="What happened to Odysseus's crew?" role="listitem">
                        What happened to Odysseus's crew?
                    </button>
                    <button class="example-btn" type="button" data-question="Who is Circe and what role does she play?" role="listitem">
                        Who is Circe and what role does she play?
                    </button>
                    <button class="example-btn" type="button" data-question="Describe Odysseus's encounter with the Cyclops" role="listitem">
                        Describe Odysseus's encounter with the Cyclops
                    </button>
                    <button class="example-btn" type="button" data-question="What is Penelope doing while Odysseus is away?" role="listitem">
                        What is Penelope doing while Odysseus is away?
                    </button>
                    <button class="example-btn" type="button" data-question="How does The Odyssey end?" role="listitem">
                        How does The Odyssey end?
                    </button>
                </div>
            </section>

            <section id="answer-section" class="answer-section hidden" aria-label="Answer" role="region" aria-live="polite">
                <div class="answer-container">
                    <h3>Answer</h3>
                    <div id="answer-text" class="answer-text"></div>
                </div>

                <div class="sources-container">
                    <h3>Sources from The Odyssey</h3>
                    <div id="sources" class="sources-grid"></div>
                </div>
            </section>

            <section id="error-section" class="error-section hidden" aria-label="Error message" role="alert">
                <div class="error-container">
                    <h3>Error</h3>
                    <p id="error-text"></p>
                </div>
            </section>
        </main>

        <footer role="contentinfo">
            <p>Source text from <a href="https://www.gutenberg.org" target="_blank" rel="noopener noreferrer">Project Gutenberg</a></p>
            <p>Powered by Anthropic Claude, Voyage AI, and ChromaDB</p>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
